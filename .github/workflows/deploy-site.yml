name: Deploy marketing site

# Azure Static Web Apps, one resource for the site:
#   pull request → its own preview URL
#   main         → the "staging" environment
#   then         → production, after a reviewer approves the "production" environment
# Skipped until the AZURE_STATIC_WEB_APPS_API_TOKEN_SITE secret exists. Setup: docs/setup.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/site/**
      - packages/tokens/**
      - packages/ui/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-site.yml
  push:
    branches: [main]
    paths:
      - apps/site/**
      - packages/tokens/**
      - packages/ui/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # the deploy action comments the preview URL on the PR

jobs:
  check:
    name: Check for the deploy token
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.token.outputs.enabled }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN_SITE isn't set, so the site isn't deployed. See docs/setup.md."
          fi

  preview:
    name: Preview
    needs: check
    if: needs.check.outputs.enabled == 'true' && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-site-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm --filter site build
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Deploy preview
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/site/dist
          skip_app_build: true
          skip_api_build: true

  close-preview:
    name: Close preview
    needs: check
    if: needs.check.outputs.enabled == 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
          action: close
          app_location: apps/site/dist

  staging:
    name: Staging
    needs: check
    if: needs.check.outputs.enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-site-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm --filter site build
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Deploy to staging
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
          action: upload
          app_location: apps/site/dist
          skip_app_build: true
          skip_api_build: true
          deployment_environment: staging

  production:
    name: Production
    needs: [check, staging]
    if: needs.check.outputs.enabled == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    # Add required reviewers to this environment in GitHub so nothing ships without approval.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm --filter site build
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Deploy to production
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SITE }}
          action: upload
          app_location: apps/site/dist
          skip_app_build: true
          skip_api_build: true
