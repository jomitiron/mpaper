name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Make this a required check on main (docs/setup.md).
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Make this a required check on main too (docs/setup.md).
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium webkit
      - name: Install browser dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium webkit
      # Builds the app (mock API on) and the site, then runs the journey, keyboard and axe checks
      # in Chromium and in WebKit at phone size.
      - run: pnpm e2e
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm --filter web build
      # The app's first load, gzipped, against e2e/perf/budgets.json.
      - run: pnpm --filter e2e budget
      - run: pnpm --filter site build
      # Lighthouse (mobile, three runs a page) on every page of the site.
      - run: pnpm --filter e2e lighthouse
      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: e2e/lighthouse-report
          retention-days: 14
